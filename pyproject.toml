[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eigenvalue-network-equilibrium"
version = "0.1.0"
description = "Exploratory, AI-assisted Markov-chain research aids for an independent study"
requires-python = ">=3.10"
dependencies = ["numpy>=2.1,<3", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
