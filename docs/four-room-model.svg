<svg xmlns="http://www.w3.org/2000/svg" width="740" height="360" viewBox="0 0 740 360" role="img" aria-labelledby="title description">
  <title id="title">One step in the four-room model</title>
  <desc id="description">From Room 1, the chance of staying in Group A is 1 minus c. Room 1 and Room 2 each receive half of that probability. The chance of moving to Group B is c. Room 3 and Room 4 each receive half of that probability.</desc>
  <rect x="1" y="1" width="738" height="358" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" fill="#16283b">
    <text x="370" y="40" font-size="25" font-weight="700">One step in the four-room model</text>
    <rect x="264" y="61" width="212" height="44" rx="10" fill="#16283b"/>
    <text x="370" y="90" font-size="20" font-weight="600" fill="#ffffff">Start in Room 1</text>

    <path d="M370 105v22 M190 145v-18h360v18" fill="none" stroke="#64748b" stroke-width="2.5"/>
    <path d="M184 144h12l-6 9z M544 144h12l-6 9z" fill="#64748b"/>

    <g fill="#eef7fa" stroke="#9ac4d1">
      <rect x="24" y="158" width="332" height="153" rx="12"/>
      <rect x="38" y="218" width="146" height="78" rx="8" fill="#ffffff"/>
      <rect x="196" y="218" width="146" height="78" rx="8" fill="#ffffff"/>
    </g>
    <g fill="#fff4e8" stroke="#deb88c">
      <rect x="384" y="158" width="332" height="153" rx="12"/>
      <rect x="398" y="218" width="146" height="78" rx="8" fill="#ffffff"/>
      <rect x="556" y="218" width="146" height="78" rx="8" fill="#ffffff"/>
    </g>

    <g font-size="21" font-weight="650">
      <text x="42" y="194" text-anchor="start">Stay in Group A</text>
      <text x="402" y="194" text-anchor="start">Move to Group B</text>
      <rect x="265" y="170" width="77" height="35" rx="8" fill="#d4eaf0"/>
      <rect x="625" y="170" width="77" height="35" rx="8" fill="#f9e4ca"/>
      <text x="303.5" y="194">1 − c</text>
      <text x="663.5" y="194">c</text>
    </g>

    <g font-size="20">
      <g font-weight="600">
        <text x="111" y="248">Room 1</text>
        <text x="269" y="248">Room 2</text>
        <text x="471" y="248">Room 3</text>
        <text x="629" y="248">Room 4</text>
      </g>
      <text x="111" y="277">(1 − c) / 2</text>
      <text x="269" y="277">(1 − c) / 2</text>
      <text x="471" y="277">c / 2</text>
      <text x="629" y="277">c / 2</text>
    </g>

    <text x="370" y="340" font-size="18" fill="#334155">Within the destination group, either room is equally likely.</text>
  </g>
</svg>
